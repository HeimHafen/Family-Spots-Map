# GitHub Pages: ein kontrollierter Veröffentlichungsablauf.
# Repository Settings > Pages > Source muss auf "GitHub Actions" stehen.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eine laufende Veröffentlichung wird abgeschlossen.
# Weitere Änderungen warten; überholte wartende Läufe werden ersetzt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate application before publishing
        run: node tools/check-project.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
