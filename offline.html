<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#f7e1d0" />
<meta name="color-scheme" content="light dark" />
<title>Offline – Family Spots Map</title>
<link rel="icon" href="assets/icons/icon-192.png" />
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f7e1d0;color:#452213;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}main{width:min(100%,480px);padding:24px;border-radius:18px;background:#fff7ee;border:1px solid #45221322;box-shadow:0 8px 24px #45221312;text-align:center}h1{font-size:24px;margin:0 0 16px}p{margin:12px 0;line-height:1.6}button{margin-top:12px;min-height:44px;padding:10px 18px;border:0;border-radius:999px;background:#f3831a;color:#452213;font:inherit;font-weight:600;cursor:pointer}button:focus-visible{outline:3px solid #7fa825;outline-offset:3px}html[data-theme=dark],html[data-theme=dark] body{background:#020617;color:#e5e7eb}html[data-theme=dark] main{background:#0f172a;border-color:#94a3b833}
</style>
</head>
<body><main aria-labelledby="title"><h1 id="title">Family Spots Map</h1><p id="message">Du bist offline. Die App ist auf diesem Gerät noch nicht vollständig verfügbar.</p><p id="hint">Öffne sie mit Internetverbindung und lass die Vorbereitung abschließen. Danach kannst du die gespeicherten Spotinfos auch offline nutzen. Kartenbilder benötigen weiterhin Internet.</p><button id="retry" type="button">Erneut versuchen</button></main>
<script>
(() => {
 const texts={de:["Du bist offline. Die App ist auf diesem Gerät noch nicht vollständig verfügbar.","Öffne sie mit Internetverbindung und lass die Vorbereitung abschließen. Danach kannst du die gespeicherten Spotinfos auch offline nutzen. Kartenbilder benötigen weiterhin Internet.","Erneut versuchen"],en:["You are offline. The app is not fully available on this device yet.","Open it with an internet connection and let preparation finish. Your saved spot information will then work offline. Map imagery still needs internet.","Try again"],da:["Du er offline. Appen er endnu ikke fuldt tilgængelig på denne enhed.","Åbn den med internetforbindelse, og lad forberedelsen afslutte. Derefter kan du bruge gemte spotoplysninger offline. Kortbilleder kræver stadig internet.","Prøv igen"]};
 let lang="de",theme;
 try{lang=localStorage.getItem("fs_lang") || navigator.language.slice(0,2);theme=localStorage.getItem("fsm_theme") || localStorage.getItem("fs_theme") || localStorage.getItem("theme");}catch{lang=navigator.language.slice(0,2);}
 if(!texts[lang])lang="de";
 document.documentElement.lang=lang;
 if(theme!=="light"&&theme!=="dark")theme=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
 document.documentElement.dataset.theme=theme;
 const copy=texts[lang];["message","hint","retry"].forEach((id,i)=>document.getElementById(id).textContent=copy[i]);
 document.getElementById("retry").addEventListener("click",()=>location.assign("./"));

})();
</script></body></html>
